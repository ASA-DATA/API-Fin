name: Deploy FastAPI to Azure Container Apps

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: actionpriceanalysisacr2026
  ACR_LOGIN_SERVER: actionpriceanalysisacr2026.azurecr.io
  IMAGE_NAME: action-price-analysis-image
  RESOURCE_GROUP: action-price-analysis-rg
  CONTAINER_APP: action-price-analysis-api

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set correct Azure resource group
        run: |
          az configure --defaults group=$RESOURCE_GROUP

      - name: Verify Azure resources
        run: |
          az account show --query "{Subscription:name,SubscriptionId:id}" --output table
          az acr show \
            --name $ACR_NAME \
            --resource-group $RESOURCE_GROUP \
            --query "{Name:name,ResourceGroup:resourceGroup,LoginServer:loginServer}" \
            --output table

      - name: Login to Azure Container Registry
        run: |
          az acr login --name $ACR_NAME

      - name: Build Docker image
        run: |
          docker build \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            .

      - name: Push Docker image
        run: |
          docker push \
            $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Update Azure Container App
        run: |
          az containerapp update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --image $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}

      - name: Configure ingress target port
        run: |
          az containerapp ingress update \
            --name $CONTAINER_APP \
            --resource-group $RESOURCE_GROUP \
            --target-port 8000